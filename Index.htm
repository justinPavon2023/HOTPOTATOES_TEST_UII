<style>
/* Fuente moderna para un look de videojuego/tecnol&#243;gico */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap');

:root {
	--bg-fallback: #0a0f1a; 
	--glass-panel: rgba(10, 15, 26, 0.7);
	--glass-border: rgba(255, 255, 255, 0.08);
	--text-main: #f8fafc;
	--text-muted: #94a3b8;
	--accent-color: #00f2fe; 
	--accent-gradient: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
	--glow-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
}

body {
	font-family: 'Poppins', sans-serif;
	background-color: var(--bg-fallback);
	
	/* INTENTO 1: Usamos la variable nativa de Hot Potatoes */
	background-image: url(proyecto/Sub.jpg) !important; 
	
	/* INTENTO 2 (Respaldo): Forzamos la imagen directamente por si la variable falla */
	background-image: url('Sub.jpg') !important;
	
	background-size: cover !important;
	background-position: center !important;
	background-attachment: fixed !important;
	color: var(--text-main);
	margin: 0;
	padding: 0;
	padding-left: 8%;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
	align-items: flex-start;
	justify-content: center;
}

div.NavButtonBar { display: none; }

div.Titles {
	padding: 0;
	text-align: left;
	margin-bottom: 1.5rem;
	z-index: 10;
	width: 100%;
	max-width: 650px;
}

.ExerciseTitle {
	font-family: 'Orbitron', sans-serif;
	font-size: 3rem;
	font-weight: 700;
	color: #ffffff;
	text-transform: uppercase;
	letter-spacing: 4px;
	margin: 0;
	text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(0, 242, 254, 0.4);
	text-align: left;
}

div.IndexDiv {
	background: var(--glass-panel);
	backdrop-filter: blur(12px);
	-webkit-backdrop-filter: blur(12px);
	width: 90vw;
	max-width: 500px;
	margin: 0;
	padding: 2.5rem;
	border-radius: 24px;
	border: 1px solid var(--glass-border);
	box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
	text-align: left;
	z-index: 10;
}

ul.Index {
	list-style: none;
	padding: 0;
	margin: 0;
	display: flex;
	flex-direction: column;
	gap: 1.5rem;
}

ul.Index li { margin: 0; }

ul.Index li a {
	display: flex;
	align-items: center;
	padding: 1.2rem 2rem;
	background: rgba(255, 255, 255, 0.03);
	color: var(--text-main);
	text-decoration: none;
	font-weight: 600;
	font-size: 1.2rem;
	letter-spacing: 1px;
	border-radius: 12px;
	border: 1px solid rgba(255, 255, 255, 0.05);
	border-left: 4px solid rgba(255, 255, 255, 0.2);
	transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
	position: relative;
	overflow: hidden;
}

ul.Index li a:hover {
	background: rgba(0, 242, 254, 0.1);
	color: #ffffff;
	border-color: var(--accent-color);
	border-left: 8px solid var(--accent-color);
	transform: translateX(15px) scale(1.02);
	box-shadow: var(--glow-shadow);
}

ul.Index li a::after {
	content: '';
	position: absolute;
	top: 0;
	left: -100%;
	width: 100%;
	height: 100%;
	background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
	transition: all 0.6s ease;
}

ul.Index li a:hover::after {
	left: 100%;
}
</style>
